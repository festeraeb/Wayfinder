name: Build and Release Windows Installer

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Set up MSVC toolchain
        # windows-latest can resolve a VS "18 Insiders" preview whose MSVC
        # linker path does not exist. Force the stable VS 2022 build tools.
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
          where link.exe

      - name: Install dependencies
        run: npm ci

      - name: Build Tauri app
        run: npm run tauri build

      - name: Upload Windows installer (EXE)
        uses: actions/upload-artifact@v4
        with:
          name: Wayfinder_Windows_Installer_EXE
          path: src-tauri/target/release/bundle/nsis/*.exe

      - name: Upload Windows installer (MSI)
        uses: actions/upload-artifact@v4
        with:
          name: Wayfinder_Windows_Installer_MSI
          path: src-tauri/target/release/bundle/msi/*.msi
