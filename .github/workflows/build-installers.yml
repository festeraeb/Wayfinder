name: Build Installers

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  build:
    name: Build installers (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Pinned: windows-latest currently resolves a VS "18 Insiders"
        # preview whose MSVC linker is missing, and macos-latest can
        # inherit a Windows C:\Program toolchain path into cc-rs.
        include:
          - os: windows-2022
            artifact: windows
          - os: macos-14
            artifact: macos

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: npm ci

      - name: Build Tauri app
        env:
          CI: true
        run: npm run tauri build

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: wayfinder-${{ matrix.artifact }}
          path: |
            src-tauri/target/release/bundle/**
            src-tauri/target/release/*.exe
            src-tauri/target/release/*.app
            src-tauri/target/release/*.dmg
          if-no-files-found: error
