# Toolchain discovery is left to rustc/cargo so the build works on any
# runner image. Hardcoding an absolute MSVC path (e.g. a VS "18 Insiders"
# preview) breaks CI: the version does not exist on the runner, and the
# [env] table is applied to every platform, so macOS tried to exec
# `C:\Program Files\...`.
#
# If a linker ever needs pinning, set it in the workflow with vcvars64.bat
# and export CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_LINKER instead.
